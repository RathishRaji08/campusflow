<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusFlow | PSG Tech</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0b1f3a;--mute:#5b6b80;--line:#dde4ec;--teal:#0f9d8a;--g:#1fa463;--a:#e6a100;--r:#d8402f;--navy:#0b1f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233b;--ink:#eaf1f8;--mute:#9fb0c4;--line:#233752;--navy:#0f9d8a}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13233b;--ink:#eaf1f8;--mute:#9fb0c4;--line:#233752;--navy:#0f9d8a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Calibri,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:16px 18px}
header b{font-size:20px}header small{display:block;opacity:.8;margin-top:2px}
main{flex:1;padding:16px 16px 84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.g{background:var(--g)}.a{background:var(--a)}.r{background:var(--r)}
.tag{font-size:12px;color:var(--mute)}h3{margin:0 0 8px;font-size:16px}
.best{background:var(--teal);color:#fff;border:0}.best .tag{color:#e6fffb}
button,select{font:inherit;color:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.seg{display:flex;gap:8px;margin:8px 0 12px}.seg button{flex:1;padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.seg button.on{border-color:var(--teal)}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.big{font-size:38px;font-weight:800;line-height:1.1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:13px 4px;border:0;background:none;cursor:pointer;color:var(--mute);font-weight:700}
nav button.on{color:var(--teal)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:6px}.bar i{display:block;height:100%}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:8px}
.src{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:4px;background:var(--line);color:var(--ink)}
.src.p{background:#e9e1ff;color:#4a2fa8}.src.n{background:#dff3f0;color:#0a6b5d}.src.c{background:#ffe9d6;color:#9a4b00}
.tr{font-weight:800;font-size:13px}.up{color:var(--r)}.dn{color:var(--g)}.st{color:var(--mute)}
.meter{height:8px;border-radius:4px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.clock{display:flex;align-items:center;gap:10px}.clock input{flex:1}.clock b{min-width:52px}
.mini{font-size:13px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;margin:0 6px 6px 0}
.peak{border-left:4px solid var(--r)}
.tab{display:none}.tab.on{display:block}
</style></head>
<body><div class="app">
<header><b>CampusFlow</b><small>predict the crowd, confirm it, then choose your entrance</small></header>
<main>
<section id="map" class="tab on"></section>
<section id="leave" class="tab"></section>
<section id="report" class="tab"></section>
<section id="admin" class="tab"></section>
<p class="note">Prototype: timetable bells are real inputs; the Wi-Fi signal is SIMULATED for this demo. Move the demo clock to see predictions change.</p>
</main>
<nav id="nav"></nav>
<div id="toast"></div>
</div>
<script>
const LV=["Clear","Busy","Jammed"],CL=["g","a","r"],ADD=[5,12,20],COL=["#1fa463","#e6a100","#d8402f"];
const BELLS=[510,720,810];
const routes=[{k:"gate",n:"Main gate",m:{h:10,d:5},w:[.85,1,.8]},{k:"bridge",n:"Hostel bridge",m:{h:6,d:14},w:[.75,.95,.7]},{k:"park",n:"Parking side",m:{h:11,d:7},w:[.5,.55,.5]}];
let user="h",cls="09:00",rem=null,tab="map",T=485,play=null,pick={r:0,l:2};
let reports=[{e:"gate",l:2,d:"s1",ts:490},{e:"gate",l:2,d:"s2",ts:492}];
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const tm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0");
const lvl=s=>s<35?0:s<65?1:2;
const pred=(r,t)=>clamp(12+BELLS.reduce((a,b,i)=>a+r.w[i]*88*Math.exp(-(((t-(b-4))/9)**2)),0),0,100);
const wifi=(r,t)=>clamp(pred(r,t)+6*Math.sin(t*1.7+r.w[0]*9),0,100);
function valid(r){return reports.filter(x=>x.e===r.k&&Math.abs(T-x.ts)<=15)}
function status(r){
 const v=valid(r),dev=new Set(v.map(x=>x.d)).size,tr=pred(r,T+8)-pred(r,T);
 const trend=tr>8?"up":tr<-8?"dn":"st";
 let s,src,cls_,note="";
 if(dev>=3){const c=[0,0,0];v.forEach(x=>c[x.l]++);const l=c.indexOf(Math.max(...c));s=[20,50,85][l];src="Confirmed ("+dev+" devices agree)";cls_="c"}
 else if(pred(r,T+8)-wifi(r,T)>15){s=pred(r,T+8);src="Predicted (timetable)";cls_="p"}
 else{s=wifi(r,T);src="Network signal (Wi-Fi density)";cls_="n"}
 if(dev&&dev<3)note=dev+" of 3 reports needed to confirm";
 return{s,l:lvl(s),src,cls_,trend,dev,note,devices:Math.round(wifi(r,T)*4.2)};
}
const score=r=>r.m[user]+ADD[status(r).l];
const best=()=>routes.reduce((a,b)=>score(b)<score(a)?b:a);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function leaveAt(){const [h,m]=cls.split(":").map(Number);return tm(h*60+m-score(best()))}
function nextPeak(){let o=null;for(let t=T;t<=T+180;t+=5)for(const r of routes){const p=pred(r,t);if(p>=65&&(!o||t<o.t)){o={r,t,p}}}return o}
const arrow={up:"▲ rising",dn:"▼ falling",st:"● steady"};
function spark(r){const W=300,H=46,a=450,b=840;const pts=[];for(let t=a;t<=b;t+=6)pts.push(((t-a)/(b-a)*W).toFixed(1)+","+(H-pred(r,t)/100*H).toFixed(1));const x=(T-a)/(b-a)*W;return`<svg viewBox="0 0 ${W} ${H}" width="100%" height="46"><polyline points="${pts.join(" ")}" fill="none" stroke="#0f9d8a" stroke-width="2"/><line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#d8402f" stroke-width="2"/></svg>`}
function draw(){
 const b=best(),sb=status(b);
 $("#map").innerHTML=`<div class="card"><div class="clock"><span class="tag">Demo clock</span><input type="range" id="clk" min="450" max="840" step="1" value="${T}"><b>${tm(T)}</b></div><div class="row" style="margin-top:6px"><button class="mini" id="plb">${play?"⏸ Pause":"▶ Play the day"}</button><button class="mini" data-j="485">08:05</button><button class="mini" data-j="705">11:45</button><button class="mini" data-j="795">13:15</button></div></div>
 <div class="seg" id="ut"><button data-u="h" class="${user==="h"?"on":""}">Hosteller</button><button data-u="d" class="${user==="d"?"on":""}">Day scholar</button></div>
 <div class="card best"><h3>Best route now: ${b.n}</h3><div class="tag">${LV[sb.l]}, about ${b.m[user]} min walk</div></div>`+
 routes.map(r=>{const s=status(r);return`<div class="card"><div class="row"><span class="dot ${CL[s.l]}"></span><div class="grow"><b>${r.n}</b> <span class="tr ${s.trend}">${arrow[s.trend]}</span><div class="tag">${r.m[user]} min walk · ~${s.devices} devices nearby (simulated)</div><span class="src ${s.cls_}">${s.src}</span>${s.note?`<div class="tag">${s.note}</div>`:""}</div><b>${LV[s.l]}</b></div><div class="meter"><i style="width:${s.s}%;background:${COL[s.l]}"></i></div></div>`}).join("");
 $("#clk").oninput=e=>{T=+e.target.value;draw()};
 $("#plb").onclick=()=>{if(play){clearInterval(play);play=null}else play=setInterval(()=>{T=T>=840?450:T+2;draw()},350);draw()};
 document.querySelectorAll("[data-j]").forEach(x=>x.onclick=()=>{T=+x.dataset.j;draw()});
 document.querySelectorAll("#ut button").forEach(x=>x.onclick=()=>{user=x.dataset.u;rem=null;draw()});
 $("#leave").innerHTML=`<div class="card"><h3>My first class starts at</h3><select id="cls">${["08:30","09:00","10:00","13:30"].map(t=>`<option ${t===cls?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="card"><div class="tag">Leave by</div><div class="big">${leaveAt()}</div><div class="tag">via ${b.n} (${LV[sb.l]}, ${sb.src.split(" (")[0].toLowerCase()}), ${score(b)} min including crowd buffer</div></div>
 <button class="btn" id="rem">${rem?"Reminder set for "+rem+" (tap to cancel)":"Set reminder for "+leaveAt()}</button>`;
 $("#cls").onchange=e=>{cls=e.target.value;rem=null;draw()};
 $("#rem").onclick=()=>{rem=rem?null:leaveAt();toast(rem?"Reminder set for "+rem:"Reminder cancelled");draw()};
 $("#report").innerHTML=`<div class="card"><h3>Where are you?</h3><div class="seg" id="sr">${routes.map((r,i)=>`<button data-i="${i}" class="${pick.r===i?"on":""}">${r.n}</button>`).join("")}</div>
 <h3>How is it?</h3><div class="seg" id="sl">${LV.map((t,i)=>`<button data-i="${i}" class="${pick.l===i?"on":""}"><span class="dot ${CL[i]}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${t}</button>`).join("")}</div>
 <button class="btn" id="send">Send report</button><button class="btn ghost" id="sim" style="margin-top:8px">Simulate 3 other students agreeing</button></div>
 <div class="tag">No login, no personal data. A status changes only when 3 different devices agree; one device can report an entrance once per 3 minutes; reports expire after 15 minutes. Try tapping Send twice.</div>`;
 document.querySelectorAll("#sr button").forEach(x=>x.onclick=()=>{pick.r=+x.dataset.i;draw()});
 document.querySelectorAll("#sl button").forEach(x=>x.onclick=()=>{pick.l=+x.dataset.i;draw()});
 $("#send").onclick=()=>{const r=routes[pick.r];if(reports.some(x=>x.d==="you"&&x.e===r.k&&Math.abs(T-x.ts)<3)){toast("Rate limit: one report per entrance every 3 min");return}
  reports.push({e:r.k,l:pick.l,d:"you",ts:T});const s=status(r);toast(s.dev>=3?r.n+" confirmed: "+LV[s.l]:"Thanks. "+s.dev+" of 3 reports needed to confirm");tab="map";show();draw()};
 $("#sim").onclick=()=>{const r=routes[pick.r];["a","b","c"].forEach(d=>reports.push({e:r.k,l:pick.l,d:"sim"+d,ts:T}));toast(r.n+" confirmed by 3 devices");tab="map";show();draw()};
 const np=nextPeak(),tot=reports.length;
 $("#admin").innerHTML=`<div class="card peak"><div class="tag">Next predicted spike (from timetable)</div><div class="big" style="font-size:26px">${np?np.r.n+" at ~"+tm(np.t):"None in next 3 h"}</div><div class="tag">${np?"Expected load "+Math.round(np.p)+"/100 before the bell. Stagger timings here.":""}</div></div>`+
 routes.map(r=>{const v=valid(r),s=v.length||1,c=[0,1,2].map(i=>v.filter(x=>x.l===i).length);return`<div class="card"><div class="row"><b class="grow">${r.n}</b><span class="tag">${v.length} active reports</span></div>${spark(r)}<div class="tag">Predicted load 07:30 to 14:00, red line = now</div><div class="bar">${c.map((n,i)=>`<i class="${CL[i]}" style="width:${n/s*100}%"></i>`).join("")}</div></div>`}).join("")+
 `<div class="card"><div class="tag">Total reports this session</div><div class="big">${tot}</div></div>`;
}
function show(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.id===tab));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}
$("#nav").innerHTML=[["map","Route status"],["leave","Leave time"],["report","Report"],["admin","Admin"]].map(([k,v])=>`<button data-t="${k}">${v}</button>`).join("");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()});
draw();show();
</script></body></html>
